services:
  - type: web
    name: my-passion
    runtime: static
    repo: https://github.com/rayan-arssi/my-passion.git
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
